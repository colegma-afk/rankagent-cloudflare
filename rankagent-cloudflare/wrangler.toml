name = "rankagent"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# ── Archivos estáticos (SPA) ──────────────────────────────
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# ── Base de datos D1 ──────────────────────────────────────
# 1) npx wrangler d1 create rankagent   (copiar el database_id aquí)
# 2) npx wrangler d1 execute rankagent --remote --file schema.sql
[[d1_databases]]
binding = "DB"
database_name = "rankagent"
database_id = "PEGA_AQUI_TU_DATABASE_ID"

# ── Cron: recuperación de corridas + re-check autónomo ────
[triggers]
crons = ["*/15 * * * *"]
